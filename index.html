<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Dashboard interactivo de comisiones Helix, enero a julio de 2026." />
    <title>Helix 12 · Dashboard de comisiones</title>
    <style>
      .boot-shell{min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#13233a}.boot-card{text-align:center}.boot-mark{width:58px;height:58px;margin:0 auto 14px;display:block;position:relative;overflow:hidden;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(25,55,92,.08)}.boot-mark img{width:225px;max-width:none;position:absolute;top:50%;right:0;transform:translateY(-50%)}.boot-card strong,.boot-card span{display:block}.boot-card strong{font-size:15px;letter-spacing:.12em}.boot-card span{margin-top:6px;color:#748198;font-size:12px}.boot-line{width:120px;height:3px;margin:18px auto 0;overflow:hidden;border-radius:99px;background:#dce5f0}.boot-line i{display:block;width:45%;height:100%;border-radius:inherit;background:#2f9b90;animation:boot 1s ease-in-out infinite alternate}@keyframes boot{to{transform:translateX(125%)}}
    </style>
  </head>
  <body>
    <div id="root"><main class="boot-shell"><div class="boot-card"><span class="boot-mark"><img src="/brand/helix-original.jpeg" alt="" /></span><strong>HELIX</strong><span>Abriendo centro de control…</span><div class="boot-line" aria-hidden="true"><i></i></div></div></main></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
